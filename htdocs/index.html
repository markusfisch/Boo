function drawText( ctx, text, x, y )
{
	for( var n = 0, l = text.length; n < l; ++n )
	{
		var ch = text.substr( n, 1 );

		if( ch == " " )
		{
			x += scaleFactor << 2;
			continue;
		}

		var sprite = sprites[ch];

		ctx && ctx.drawImage(
			sprite,
			x | 0,
			(y-sprite.height) | 0 );

		x += scaleFactor+sprite.width;
	}

	return x;
}

function putText( ctx, text )
{
	var y = sprites.a.height;

	ctx.clearRect( 0, 0, width, y );
	drawText( ctx, text, 0, y );
}

function drawSprite( sprite, x, y )
{
	ctxFg.drawImage(
		sprite,
		(x-sprite.centerX) | 0,
		(y-sprite.centerY) | 0 );
}

function scatter( p )
{
	p.x += p.vx*factor;
	p.y += p.vy*factor;
	p.vx *= 1.005;
	p.vy *= 1.005;
}

function drawFragments()
{
	var pixel = Math.ceil( scaleFactor );

	for( var n = fragmentsLength; n--; )
	{
		var f = fragments[n];

		if( f.x < 0 ||
			f.x > width ||
			f.y < 0 ||
			f.y > height )
			continue;

		scatter( f );
		f.spin += factor*.06;
		++f.live;

		var sin = Math.sin( f.spin )*scaleFactor*2;

		ctxFg.fillStyle = f.color;
		ctxFg.fillRect(
			(f.x+sin*f.vy) | 0,
			(f.y-sin*f.vx) | 0,
			pixel,
			pixel );
	}
}

function drawPlayer()
{
	var state = "ghost";

	if( now-playerFrameLast > frameFrequency )
	{
		++playerFrame;
		playerFrame %= 6;
		playerFrameLast = now;
	}

	ctxFg.globalAlpha = pointerLength ? 1 : .3;
	drawSprite(
		sprites[state+playerFrame],
		playerX,
		playerY+Math.sin( now*.002 )*scaleFactor );
	ctxFg.globalAlpha = 1;
}

function bounce( value, change, min, max )
{
	var l = max-min,
		r;

	if( (r = value-min) < change )
		value = min-(r % l);
	else if( (r = value-max) > change )
		value = max-(r % l);

	return value;
}

function setFragments()
{
	for( var n = fragmentsLength; n--; )
	{
		var f = fragments[n],
			speed = 1+Math.random()*scaleFactor;

		f.x = playerX+f.ox*scaleFactor;
		f.y = playerY+f.oy*scaleFactor;
		f.vx = f.ovx*speed;
		f.vy = f.ovy*speed;
		f.live = 0;
	}
}

function notifyPriests()
{
	for( var n = objectsLength; n--; )
	{
		var p = objects[n],
			dx = p.x-playerX,
			dy = p.y-playerY,
			d = Math.sqrt( dx*dx + dy*dy );

		p.crow = now+Math.random()*(d/scaleFactor)*10;
	}
}

function killPlayer()
{
	playerAlive = false;
	setFragments();
	notifyPriests();

	setTimeout(
		function()
		{
			gameOver = true;

			var t = "try again!";
			messageWidth = drawText( null, t, 0, 0 );
			putText( ctxMessage, t );
		},
		1500 );
}

function winGame()
{
	gameOver = gameWon = true;
	restartAt = now+3000;
	++pumpkinCount;
	pointerLength = 0;

	var t = "you won!";
	messageWidth = drawText( null, t, 0, 0 );
	putText( ctxMessage, t );

	for( var n = objectsLength; n--; )
	{
		var p = objects[n],
			alpha = Math.atan2( p.y-playerY, p.x-playerX ),
			speed = 1+Math.random()*scaleFactor;

		p.vx = Math.cos( alpha )*speed;
		p.vy = Math.sin( alpha )*speed;
		p.frame %= 8;
	}
}

function drawPriestFleeing( p )
{
	scatter( p );

	if( now-p.lastFrame > frameFrequency )
	{
		++p.frame;
		p.frame %= 8;
		p.lastFrame = now;
	}

	drawSprite(
		sprites["priestWalk"+(p.vx > 0 ? "Right" : "Left")+p.frame],
		p.x,
		p.y );
}

function drawPriestCrowing( p )
{
	if( now-p.lastFrame > frameFrequency )
	{
		++p.frame;
		p.frame %= 4;
		p.lastFrame = now;
	}

	drawSprite(
		sprites["priestCrow"+(p.frame % 4)],
		p.x,
		p.y );
}

function drawPriestWalking( p )
{
	for( var n = 0; n < objectsLength; ++n )
	{
		var other = objects[n],
			dx,
			dy;

		if( other !== p &&
			(dx = other.x-p.x) < boundCollision &&
			(dy = other.y-p.y) < boundCollision &&
			dx*dx + dy*dy < radiusCollision )
		{
			p.x += -dx;
			p.y += -dy;
			p.vx = -p.vx;
			p.vy = -p.vy;
		}
	}

	var state = "priestWalk"+(p.vx > 0 ? "Right" : "Left");

	p.x += p.vx*factor;
	p.y += p.vy*factor;

	if( p.x < mapLeft ||
		p.x > mapRight )
	{
		p.x = bounce( p.x, p.vx, mapLeft, mapRight );
		p.vx = -p.vx;
	}

	if( p.y < mapTop ||
		p.y > mapBottom )
	{
		p.y = bounce( p.y, p.vy, mapTop, mapBottom );
		p.vy = -p.vy;
	}

	var dx = playerX-p.x,
		dy = playerY-p.y,
		d = dx*dx + dy*dy;

	if( d < radiusSeen )
	{
		if( playerAlive &&
			(d = Math.sqrt( d )) < radiusCastOut )
			killPlayer();

		if( pointerLength )
		{
			d /= scaleFactor;
			p.vx = dx/d;
			p.vy = dy/d;
		}
	}

	if( now-p.lastFrame > frameFrequency )
	{
		++p.frame;
		p.frame %= 8;
		p.lastFrame = now;
	}

	drawSprite(
		sprites[state+p.frame],
		p.x,
		p.y );
}

function compareY( a, b )
{
	if( a.y > b.y )
		return 1;

	if( a.y < b.y )
		return -1;

	return 0;
}

function drawPriests()
{
	objects.sort( compareY );

	for( var n = 0; n < objectsLength; ++n )
	{
		var p = objects[n];

		if( gameWon )
			drawPriestFleeing( p );
		else if( p.crow < now )
			drawPriestCrowing( p );
		else
			drawPriestWalking( p );
	}
}

function createPumpkins()
{
	var margin = 8*scaleFactor,
		w = Math.max( 0, mapRight-mapLeft-margin*2 ),
		h = Math.max( 0, mapBottom-mapTop-margin*2 ),
		minDistance = 24*scaleFactor;

	pumpkins = [];

	for( var n = 0; n < pumpkinCount; ++n )
	{
		var x, y, tooClose = true

		while( tooClose )
		{
			x = mapLeft+margin+random()*w,
			y = mapTop+margin+random()*h;
			tooClose = false;

			for( var i = 0; i < n; ++i )
			{
				var dx = x-pumpkins[i].x,
					dy = y-pumpkins[i].y;

				if( dx*dx+dy*dy < minDistance*minDistance )
				{
					tooClose = true;
					break;
				}
			}
		}

		pumpkins.push( {
			x: x,
			y: y,
			variant: random()*3 | 0 } );
	}
}

function drawPumpkins()
{
	for( var n = pumpkins.length; n--; )
	{
		var p = pumpkins[n],
			dx = p.x-playerX,
			dy = p.y-playerY,
			radius = 8*scaleFactor;

		if( playerAlive && dx*dx+dy*dy < radius*radius )
		{
			pumpkins.splice( n, 1 );
			++pumpkinScores;
			if( pumpkins.length == 0 )
			{
				winGame();
			}
			continue;
		}

		drawSprite( sprites["pumpkin"+p.variant], p.x, p.y );
	}
}

function drawPumpkinScore()
{
	var text = ""+pumpkinScores,
		textWidth = drawText( null, text, 0, 0 ),
		sprite = sprites.pumpkin0,
		x = width-hudX-textWidth,
		y = hudY+sprite.height;

	ctxFg.drawImage( sprite, x-scaleFactor*3-sprite.width, hudY );
	drawText( ctxFg, text, x, y );
}

function draw()
{
	if( resizing )
		return;

	ctxFg.clearRect( 0, 0, width, height );

	drawPumpkins();
	drawPriests();

	if( playerAlive )
		drawPlayer();
	else
	{
		drawFragments();
	}

	if( gameOver )
	{
		ctxFg.drawImage(
			message,
			centerX-(messageWidth >> 1),
			centerY );
	}

	ctxFg.drawImage( hud, hudX, hudY );
	drawPumpkinScore();
}

function random()
{
	// from http://indiegamr.com/generate-repeatable-random-numbers-in-js/
	return (seed = (seed*9301+49297) % 233280)/233280;
}

function createPriests()
{
	var w = mapRight-mapLeft,
		h = mapBottom-mapTop,
		min = Math.min( w, h )*.3;

	for( var n = objectsLength; n--; )
	{
		var a = random()*Math.TAU,
			speed = (.4+random()*.6)*scaleFactor,
			x,
			y;

		do
		{
			x = mapLeft+random()*w,
			y = mapTop+random()*h;
		} while( Math.abs( x-playerX )+Math.abs( y-playerY ) < min );

		objects[n] = {
			x: x,
			y: y,
			vx: Math.cos( a )*speed,
			vy: Math.sin( a )*speed,
			crow: now+now,
			frame: random()*8 | 0,
			lastFrame: 0 };
	}
}

function drawGraves()
{
	var ref = sprites.grave0,
		w = Math.round( ref.width*1.75 ),
		h = Math.round( ref.height*1.5 ),
		mw = Math.round( mapRight-mapLeft ),
		mh = Math.round( mapBottom-mapTop ),
		gw = (mw/w | 0)*w,
		gh = (mh/h | 0)*h,
		px = (mw-gw) >> 1,
		py = (mh-gh) >> 1,
		left = mapLeft+px,
		top = mapTop+py,
		right = left+gw,
		bottom = top+gh,
		n = 0;

	for( var y = top; y < bottom; y += h )
		for( var x = left; x < right; x += w )
		{
			var sprite = sprites["grave"+(++n % 12)];

			ctxBg.drawImage(
				sprite,
				(x+((w-sprite.width) >> 1)) | 0,
				(y+((h-sprite.height) >> 1)) | 0 );
		}
}

function drawYard()
{
	var size = sprites.yardTopLeft.width,
		mw = mapRight-mapLeft,
		mh = mapBottom-mapTop,
		cols = mw/size | 0,
		rows = mh/size | 0;

	objectsLength = Math.ceil( Math.sqrt( cols*rows ) );
}

function drawGround()
{
	var sprite = sprites.ground,
		w = sprite.width,
		h = sprite.height;

	for( var y = 0; y < height; y += h )
		for( var x = 0; x < width; x += w )
			ctxBg.drawImage(
				sprite,
				x,
				y );
}

function drawBackground()
{
	drawGround();
	drawYard();
	drawGraves();
}

function updateScore()
{
	putText( ctxHud, ""+scores );
}

function reset()
{
	gameOver = false;
	gameWon = false;
	restartAt = 0;

	seed = Math.PI;
	playerX = centerX;
	playerY = centerY;
	playerAlive = true;
	playerFrameLast = playerFrame = 0;
	scoreLast = scores = 0;
	pumpkinScores = 0;

	drawBackground();
	createPriests();
	createPumpkins();

	updateScore();
}

function restart()
{
	reset();
	pointerLength = 0;
}

function input()
{
	if( gameWon && now < restartAt )
	{
		pointerLength = 0;
		return;
	}

	if( gameOver &&
		pointerLength > 0 )
	{
		restart();
		return;
	}

	if( gameWon )
		return;

	for( var n = Math.min( pointerLength, 1 ); n--; )
	{
		playerX = pointerX[n];

		if( playerX < mapLeft )
			playerX = mapLeft;
		else if( playerX > mapRight )
			playerX = mapRight;

		playerY = pointerY[n];

		if( playerY < mapTop )
			playerY = mapTop;
		else if( playerY > mapBottom )
			playerY = mapBottom;
	}
}

function run()
{
	requestAnimFrame( run );

	now = new Date().getTime();
	factor = (now-last)/16;
	last = now;

	if( playerAlive && !gameOver &&
		now-scoreLast > 100 )
	{
		++scores;
		scoreLast = now;
		updateScore();
	}

	input();
	draw();
}

function setPointers( ev, down )
{
	var e = ev || event;

	if( gameWon && new Date().getTime() < restartAt )
	{
		pointerLength = 0;
		e.preventDefault();
		return false;
	}

	if( down < 1 )
	{
		// process remaining touches
		if( pointerLength > 0 &&
			e.touches &&
			(down = e.touches.length) )
			return setPointers( e, down );

		pointerLength = 0;
	}
	else if( e.touches )
	{
		pointerLength = e.touches.length;

		for( var n = 0; n < pointerLength; ++n )
		{
			var t = e.touches[n];

			pointerX[n] = t.pageX;
			pointerY[n] = t.pageY;
		}
	}
	else if( typeof e.clientX !== "undefined" )
	{
		pointerX[0] = e.clientX;
		pointerY[0] = e.clientY;
		pointerLength = 1;
	}
	else if( typeof e.pageX !== "undefined" )
	{
		pointerX[0] = e.pageX;
		pointerY[0] = e.pageY;
		pointerLength = 1;
	}

	if( ratio != 1 )
		for( var n = 0; n < pointerLength; ++n )
		{
			pointerX[n] = pointerX[n]*ratio | 0;
			pointerY[n] = pointerY[n]*ratio | 0;
		}

	// to avoid overscrolling on iOS it's important to
	// catch pointer events
	e.preventDefault();
	return false;
}

function pointerUp( ev )
{
	return setPointers( ev, 0 );
}

function pointerMove( ev )
{
	return setPointers( ev, pointerLength );
}

function pointerDown( ev )
{
	return setPointers( ev, 1 );
}

function scaleSprite( res, rect, w, h )
{
	var c = document.createElement( "canvas" ),
		cx = c.getContext( "2d" );

	c.width = w;
	c.height = h;

	c.centerX = w >> 1;
	c.centerY = h >> 1;

	var offset = rect.y*(atlasWidth << 2)+(rect.x << 2),
		skip = (atlasWidth-rect.w) << 2,
		xs = 0,
		xf = scaleFactor;

	if( res.mirror )
	{
		xf = -xf;
		xs = (scaleFactor*rect.w+xf) | 0;
	}

	for( var ay = rect.h, sy = 0;
		ay--;
		offset += skip, sy += scaleFactor )
	{
		var y = Math.ceil( sy ),
			h = Math.ceil( sy+scaleFactor )-y;

		for( var ax = rect.w, sx = xs;
			ax--;
			sx += xf )
		{
			var r = atlas[offset++],
				g = atlas[offset++],
				b = atlas[offset++],
				a = atlas[offset++];

			if( a == 0 )
				continue;

			var x = Math.ceil( sx );

			cx.fillStyle = 'rgba('+r+','+g+','+b+','+(a/255)+')';
			cx.fillRect(
				x,
				y,
				Math.ceil( sx+Math.abs( xf ) )-x,
				h );
		}
	}

	return c;
}

function scale()
{
	for( var name in resources )
	{
		var res = resources[name],
			rc = res.rect,
			w = Math.max( Math.ceil( rc.w*scaleFactor ), 1 ),
			h = Math.max( Math.ceil( rc.h*scaleFactor ), 1 );

		sprites[name] = scaleSprite( res, rc, w, h );
	}
}

function resize()
{
	var w = window.innerWidth,
		h = window.innerHeight;

	width = w*ratio | 0;
	height = h*ratio | 0;

	bg.width = fg.width = width;
	bg.height = fg.height = height;
	bg.style.width = fg.style.width = w+"px";
	bg.style.height = fg.style.height = h+"px";

	centerX = width >> 1;
	centerY = height >> 1;

	var mapSize = Math.min( width, height );

	scaleFactor = Math.max(
		1,
		mapSize/16/resources.yardTopLeft.rect.w );

	scale();

	hud.width = message.width = width;
	hud.height = message.height =
		resources.f.rect.h*scaleFactor | 0;

	hudX = hudY = scaleFactor << 2;

	mapLeft = (width-mapSize) >> 1;
	mapTop = (height-mapSize) >> 1;
	mapRight = mapLeft+mapSize;
	mapBottom = mapTop+mapSize;

	reset();

	radiusSeen = mapSize*.2 | 0;
	radiusSeen *= radiusSeen;
	radiusCastOut = sprites.ghost0.width*.5 | 0;
	radiusCollision = radiusCastOut << 4;
	boundCollision = Math.sqrt( radiusCastOut )*.5 | 0;

	resizing = false;
}

function scheduleResize()
{
	if( resizeTimer )
		clearTimeout( resizeTimer );

	if( running )
		resizing = true;

	resizeTimer = setTimeout( resize, 200 );
}

function start()
{
	var d = document;

	d.onmousedown = pointerDown;
	d.onmousemove = pointerMove;
	d.onmouseup = pointerUp;
	d.onmouseout = pointerUp;

	if( "ontouchstart" in d )
	{
		d.ontouchstart = pointerDown;
		d.ontouchmove = pointerMove;
		d.ontouchend = pointerUp;
		d.ontouchleave = pointerUp;
		d.ontouchcancel = pointerUp;
	}

	last = new Date().getTime();
	running = true;
	run();
}

function createFragments()
{
	var rect = resources.ghost0.rect,
		w2 = rect.w >> 1,
		h2 = rect.h >> 1,
		offset = rect.y*(atlasWidth << 2)+(rect.x << 2),
		skip = (atlasWidth-rect.w) << 2;

	fragmentsLength = 0;

	for( var y = 0, h = rect.h; y < h; ++y, offset += skip )
		for( var x = 0, w = rect.w; x < w; ++x )
		{
			var r = atlas[offset++],
				g = atlas[offset++],
				b = atlas[offset++],
				a = atlas[offset++];

			if( a == 0 )
				continue;

			var cx = x-w2,
				cy = y-h2,
				alpha = Math.atan2( cy, cx ),
				vx = Math.cos( alpha ),
				vy = Math.sin( alpha );

			fragments[fragmentsLength++] = {
				color: 'rgba('+r+','+g+','+b+','+(a/255)+')',
				ox: cx,
				oy: cy,
				ovx: vx,
				ovy: vy,
				spin: Math.random()*Math.TAU };
		}
}

function decompressAtlas()
{
	var c = document.createElement( "canvas" ),
		x = c.getContext( "2d" ),
		w = atlas.width,
		h = atlas.height;

	c.width = w;
	c.height = h;
	x.drawImage( atlas, 0, 0 );

	atlas = x.getImageData( 0, 0, w, h ).data;
	atlasWidth = w;
}

function init()
{
	if( !atlas.complete ||
		new Date().getTime()-last < 500 )
	{
		// give mobile browsers some time to settle
		// their window.innerWidth/Height values, i.e.
		// there may still be the virtual keyboard visible
		setTimeout( init, 500 );
		return;
	}

	decompressAtlas();
	createFragments();

	resize();
	window.onresize = scheduleResize;

	document.body.appendChild( bg );
	document.body.appendChild( fg );

	start();
}

function createCanvas()
{
	if( !(bg = document.createElement( "canvas" )) ||
		!(ctxBg = bg.getContext( "2d", { alpha: false } )) ||
		!(fg = document.createElement( "canvas" )) ||
		!(ctxFg = fg.getContext( "2d" )) ||
		!(hud = document.createElement( "canvas" )) ||
		!(ctxHud = hud.getContext( "2d" )) ||
		!(message = document.createElement( "canvas" )) ||
		!(ctxMessage = message.getContext( "2d" )) )
		return false;

	ratio =
		(window.devicePixelRatio || 1)/
		(ctxBg.webkitBackingStorePixelRatio ||
			ctxBg.mozBackingStorePixelRatio ||
			ctxBg.msBackingStorePixelRatio ||
			ctxBg.oBackingStorePixelRatio ||
			ctxBg.backingStorePixelRatio ||
			1);

	return true;
}
